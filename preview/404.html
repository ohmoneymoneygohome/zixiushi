<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 十友齋 ZIXIU</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/rabbit.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@0;1&family=Cutive+Mono&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--navy:#11264f;--pink:#f58f98;--cream:#f2ead9;--cyan:#009ad6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;display:grid;place-items:center;padding:32px;
    background:var(--navy);color:var(--cream);text-align:center;
    font-family:"Bricolage Grotesque","Noto Serif TC",sans-serif;font-weight:300;
  }
  img{width:130px;margin:0 auto 26px;opacity:.9}
  p.no{font-family:"Cutive Mono",monospace;font-size:11px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
  h1{font-size:clamp(38px,8vw,84px);line-height:1;letter-spacing:-.03em;margin:14px 0 10px;font-weight:300}
  h1 em{font-family:"Instrument Serif",serif;font-style:italic;color:var(--pink)}
  .zh{font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.3em;color:rgba(242,234,217,.55)}
  a{
    display:inline-block;margin-top:34px;padding:14px 26px;border:1px solid rgba(242,234,217,.3);
    border-radius:999px;font-family:"Cutive Mono",monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--cream);text-decoration:none;transition:.3s;
  }
  a:hover{background:var(--pink);border-color:var(--pink);color:var(--navy)}
</style>
</head>
<body>
  <main>
    <img src="assets/rabbit.png" alt="十友齋">
    <p class="no">Error 404</p>
    <h1>This wall is <em>empty</em>.</h1>
    <p class="zh">這面牆還沒有畫。</p>
    <a href="/">Back to the room · 回到自修室</a>
  </main>
</body>
</html>
